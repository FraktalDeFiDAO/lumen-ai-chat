version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Everything lands on dev first, like anything else.
    target-branch: dev
    groups:
      # Two pull requests, not one per package. The gate takes twenty minutes,
      # and reviewing nine separate bumps of one toolchain is not nine times the
      # information -- which is what the first version of this file produced,
      # because naming packages individually misses every one not on the list.
      #
      # Split by blast radius instead: what ships to users, and what only builds
      # it. A runtime bump deserves a careful look; a linter bump deserves a
      # green pipeline.
      runtime:
        dependency-type: production
      tooling:
        dependency-type: development
  - package-ecosystem: cargo
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    target-branch: dev
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: dev
