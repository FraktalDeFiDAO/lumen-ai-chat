version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Everything lands on dev first, like anything else.
    target-branch: dev
    groups:
      # One pull request per ecosystem rather than per package: the gate takes
      # twenty minutes, and reviewing fifteen separate bumps of the same
      # toolchain is not fifteen times the information.
      dev-tooling:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "vue-eslint-parser", "@playwright/*", "playwright-core", "vitest", "@vitejs/*", "vue-tsc", "typescript"]
      runtime:
        patterns: ["vue", "vue-router", "pinia", "tailwindcss", "@tailwindcss/*", "lucide-vue-next"]
  - package-ecosystem: cargo
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    target-branch: dev
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: dev
