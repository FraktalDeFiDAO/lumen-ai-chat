name: Change request
description: Something should work differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today. Not the solution yet.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
  - type: textarea
    id: cost
    attributes:
      label: What it would cost
      description: New dependencies, a slower build, a boundary that gets weaker.
